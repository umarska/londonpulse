[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "londonpulse"
version = "1.0.0"
description = "Seven-day London cycle hire forecasting with temporal backtesting and an interactive research app"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "scikit-learn==1.9.1",
  "joblib>=1.4,<2",
  "flask>=3.1,<4",
  "matplotlib>=3.9,<4",
  "threadpoolctl>=3.5,<4",
  "requests>=2.32,<3",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
notebook = ["nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8", "nbconvert>=7,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
